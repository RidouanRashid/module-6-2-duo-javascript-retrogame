<!--
  Simple Pong - index.html
  Omschrijving: Toegangspunt voor het Pong-spel. Bevat het canvas en de knoppen.
  Auteurs: Jelle Romijn, Ridouan Rashid
  Aantekeningen: De pagina laadt `game.js` dat alle game-logica afhandelt. Voeg hier vaste UI-elementen toe
  (bijv. verplaats AI-moeilijkheidsknoppen hierheen) als je statische knoppen verkiest boven dynamische aanmaak.
-->
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eenvoudig Pong</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>Pong</h1>
    <canvas id="game" width="800" height="500"></canvas>
    <button class="button" id="resetBtn">Opnieuw</button>
    <button class="button" id="pauseBtn">Pauze</button>
    <button class="button" id="muteBtn">Geluid: AAN</button>
<br>
    <button class="button" id="bgBtn1" title="Zwarte achtergrond">Zwart</button>
      <button class="button" id="bgBtn2" title="Blauwe achtergrond">Blauw</button>
      <button class="button" id="bgBtn3" title="Groene achtergrond">Groen</button>
      <button class="button" id="bgBtn4" title="Rode achtergrond">Rood</button>
      <button class="button" id="bgBtnImg" title="Afbeelding achtergrond">Kerst</button>

      <div class="instructies">
        <strong>Instructies</strong>
        <ul>
          <li>Speler 1 (links): <strong>W</strong> omhoog, <strong>S</strong> omlaag</li>
          <li>Speler 2 (rechts): <strong>↑</strong> omhoog, <strong>↓</strong> omlaag</li>
          <li>Doel: scoor 10 punten om te winnen</li>
          <li>Druk <strong>M</strong> voor volgende modus, <strong>N</strong> voor vorige modus</li>
        </ul>
      </div>
    </div>
  <script src="game.js"></script>
</body>
</html>
