<!DOCTYPE html>
<html lang="nl">
<head>
    <!-- Meta tags voor karakter encoding en viewport instellingen -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Titel van de webpagina -->
    <title>Special Pong Game</title>
    
    <!-- Link naar het externe CSS bestand voor styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hoofd container voor de hele game -->
    <div class="game-container">
        
        <!-- Titel sectie -->
        <h1>🎮 Special Pong Game 🎮</h1>
        
        <!-- Instructies voor de spelers -->
        <div class="instructions">
            <p><strong>Speler 1 (Links):</strong> W (omhoog) / S (omlaag)</p>
            <p><strong>Speler 2 (Rechts):</strong> ↑ (omhoog) / ↓ (omlaag)</p>
            <p><strong>Start/Herstart:</strong> Druk op SPATIE</p>
        </div>
        
        <!-- Score weergave sectie -->
        <div class="score-display">
            <div class="player-score">
                <span class="score-label">Speler 1</span>
                <span id="player1-score" class="score">0</span>
            </div>
            <div class="player-score">
                <span class="score-label">Speler 2</span>
                <span id="player2-score" class="score">0</span>
            </div>
        </div>
        
        <!-- Canvas element waar de game wordt getekend -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Game status bericht (wordt getoond bij start/einde) -->
        <div id="game-message">Druk op SPATIE om te starten!</div>
    </div>
    
    <!-- Link naar het externe JavaScript bestand voor game logica -->
    <script src="game.js"></script>
</body>
</html>
