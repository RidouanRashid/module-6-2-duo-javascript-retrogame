<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Pong</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>Simple Pong</h1>
    <canvas id="game" width="800" height="500"></canvas>
    <button class="button" id="resetBtn">Reset</button>
    <button class="button" id="pauseBtn">Pause</button>
    <div id="modeText" style="margin-top:8px; font-family:Arial, sans-serif; font-size:14px; color:#333;"></div>
    <div style="margin-top:12px;">
      <button class="button" id="bgBtn1" title="Zwarte achtergrond">Background: Dark</button>
      <button class="button" id="bgBtn2" title="Blauwe achtergrond">Background: Blue</button>
      <button class="button" id="bgBtn3" title="Groene achtergrond">Background: Green</button>
      <button class="button" id="bgBtn4" title="Rode achtergrond">Background: Red</button>
      <button class="button" id="bgBtnImg" title="Afbeelding achtergrond">Background: Image</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
